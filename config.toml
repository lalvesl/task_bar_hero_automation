# Tunables for the bot. Everything here is calibrated against a real game
# window; see docs/ui_map.md for where each point came from and why the
# synthesize check is written as a channel comparison rather than a colour
# match.
#
# Points are fractions of the game window, never screen pixels, so they survive
# the window moving and the virtual screen being resized.

display = ":9"
window = "TaskBarHero"

# How long to stand down after you click in the viewer. A person and the bot
# clicking the same UI would fight, so every click of yours pushes this out
# again and the bot only resumes once you have stopped.
pause_after_click_secs = 5.0

# How long to wait after the window appears before doing anything. The game
# plays a long opening sequence, and a click during it lands on whatever the
# intro is drawing rather than on the UI the task expects.
startup_delay_secs = 30.0

# TBH: Task Bar Hero on Steam. The launch options for this app id are what point
# the game at the isolated display.
steam_app_id = 3678970

# Loopback port the "show" mirror serves on.
vnc_port = 5909

[stash]
menu_icon = { x = 0.382, y = 0.723 }
store_all = { x = 0.212, y = 0.728 }

[cube]
# The task on-off switch. Off by default: a bot that clicks on its own should
# not start clicking merely because the process came up. Turn it on with
# "enable synthesis" at the prompt.
enabled = false

# Deposit the inventory into the stash first. Auto-fill draws from the stash
# too, so this is what makes a full inventory available to the cube.
store_all_first = true

# Seconds between runs while the task is enabled.
interval_secs = 600

# A stop that does not depend on reading the screen correctly.
max_per_run = 100

menu_icon = { x = 0.559, y = 0.723 }
auto_fill = { x = 0.765, y = 0.595 }
synthesize = { x = 0.906, y = 0.595 }

# Disabled, the button is pure grey and every channel is equal. Enabled, it is
# blue and leads red by around 80 at these three pixels. A margin of 40 sits
# clear of both.
[cube.synthesize_enabled]
lead = "blue"
over = "red"
min_delta = 40
points = [
  { x = 0.8746, y = 0.5830 },
  { x = 0.9241, y = 0.6081 },
  { x = 0.9364, y = 0.5955 },
]

[chest]
# The task on-off switch. Off by default, same reasoning as the cube.
enabled = false

# Seconds between passes. Every pass costs a capture and a scan, so this is the
# bot's own power knob on a machine whose CPU clock is held down on purpose.
interval_secs = 2.0

# The row can hold more than the two slots seen during calibration, so the
# region is wider than the combat strip above it and the cap is generous.
# A stop that does not depend on reading the band correctly.
max_clicks_per_pass = 16

# Chests drop onto pure black, so finding them is a scan for columns that are
# not black rather than a template match. Measured against a real capture: two
# chests, 75 columns wide each, six columns of background between them.
#
# max_gap has to stay under that six-column separation: set to 0.005, which is
# six pixels at this window size, the two chests merged into one blob and every
# click landed in the gap between them.
[chest.scan]
region = { x = 0.230, y = 0.145, width = 0.540, height = 0.053 }
min_luma = 24
max_gap = 0.002
min_width = 0.020

# The offline-rewards dialog the game opens on launch. It sits over everything
# and swallows clicks, so it is closed before anything else is attempted.
#
# Its presence is checked rather than the close button being clicked blindly:
# with no dialog up, that position sits inside the hero panel.
[popup]
close = { x = 0.500, y = 0.677 }

# The dialog's title banner is red; with no dialog there, the same pixels are
# pure black. Red leading blue separates the two without depending on an exact
# shade, the same shape of test the synthesize button uses.
[popup.visible]
lead = "red"
over = "blue"
min_delta = 30
points = [
  { x = 0.4373, y = 0.3731 },
  { x = 0.5528, y = 0.3731 },
  { x = 0.4950, y = 0.3659 },
]

# The main menu. Whether it is open decides how many times Tab has to be
# pressed to leave it open, and guessing gets that wrong half the time.
#
# Its title banner is red; with the menu closed the same pixels are black.
[menu.visible]
lead = "red"
over = "blue"
min_delta = 30
points = [
  { x = 0.4455, y = 0.2978 },
  { x = 0.5545, y = 0.2978 },
  { x = 0.5000, y = 0.3049 },
]
